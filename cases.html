<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <link rel="icon" href="favicon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>專業實績 | 錦德防水工程</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 這裡保留您之前的 CSS 樣式 (省略以縮短長度，請沿用之前的 Style) */
        :root { --primary: #0F172A; --accent: #B8860B; --bg-light: #f8fafc; }
        body { font-family: "Noto Sans TC", sans-serif; margin: 0; background: var(--bg-light); }
        .case-section { padding: 60px 6%; max-width: 1400px; margin: 0 auto; }
        .case-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 40px; }
        .case-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .case-img-wrapper { height: 250px; position: relative; overflow: hidden; }
        .case-img { height: 100%; background-size: cover; background-position: center; }
        .case-badge { position: absolute; top: 15px; left: 15px; background: var(--accent); color: white; padding: 5px 12px; border-radius: 5px; font-size: 0.8rem; font-weight: 800; }
        .case-body { padding: 25px; }
        .case-body h3 { margin: 0 0 10px; color: var(--primary); }
        /* 頁首頁尾樣式請保留... */
    </style>
</head>
<body>
    <section class="case-section">
        <div class="case-grid" id="caseGrid">
            <p style="text-align: center; grid-column: 1/-1;">實績載入中...</p>
        </div>
    </section>

    <script>
        // 1. 設定您的圖片路徑 (假設圖片跟網頁在同一個倉庫)
        const imgPath = "./"; 

        // 2. 開始抓取 cases.json
        fetch('cases.json')
            .then(response => response.json())
            .then(data => {
                const grid = document.getElementById('caseGrid');
                grid.innerHTML = ''; // 清除「載入中」文字

                data.forEach(item => {
                    // 組合 HTML 結構
                    const card = `
                        <div class="case-card">
                            <div class="case-img-wrapper">
                                <span class="case-badge">${item.category}</span>
                                <div class="case-img" style="background-image: url('${imgPath}${item.image}');"></div>
                            </div>
                            <div class="case-body">
                                <h3>${item.title}</h3>
                                <p>${item.description}</p>
                            </div>
                        </div>
                    `;
                    grid.innerHTML += card;
                });
            })
            .catch(err => {
                console.error('讀取資料失敗:', err);
                document.getElementById('caseGrid').innerHTML = '<p>暫時無法載入實績，請稍後再試。</p>';
            });
    </script>
</body>
</html>
