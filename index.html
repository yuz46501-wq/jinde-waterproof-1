    <style>
        :root {

            --accent: #B8860B; 
            --accent-light: #D4AF37;
            --bg-light: #F8FAFC;
            --white: #FFFFFF;

        /* --- [開場動畫] --- */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary);
            display: flex; justify-content: center; align-items: center;
            z-index: 99999;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .loader-content { text-align: center; color: white; padding: 20px; }
        .loader-logo {
            font-size: clamp(1.8rem, 5vw, 2.5rem); font-weight: 900; margin: 0;
            letter-spacing: 5px; color: white;
            animation: logoFadeIn 1s ease-out forwards;
        }
        .loader-logo span { color: var(--accent); }
        .loader-line-box {
            width: 180px; height: 2px; background: rgba(255,255,255,0.1);
            margin: 25px auto; position: relative; overflow: hidden;
        }
        .loader-line-fill {
            position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: var(--accent);
            animation: lineSwipe 1.5s ease-in-out infinite;
        }
        #loader.loaded { transform: translateY(-100%); }

        @keyframes logoFadeIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes lineSwipe { 0% { left: -100%; } 50% { left: 0; } 100% { left: 100%; } }

        * { box-sizing: border-box; scroll-behavior: smooth; }
        body { 
            font-family: "Noto Sans TC", sans-serif; 
            margin: 0; background: var(--bg-light); color: var(--text-main); 
            line-height: 1.8; overflow-x: hidden;
        }

        .reveal { opacity: 0; transform: translateY(40px); transition: all 1s cubic-bezier(0.2, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }

        /* --- [導覽列] --- */
        .header-fixed-container { position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.05); background: white; }

        .logo img { height: 50px; margin-right: 12px; }
        .logo span { color: var(--accent); }
        .hamburger { display: block; cursor: pointer; font-size: 1.5rem; color: var(--primary); z-index: 10001; }

        .marquee-content { white-space: nowrap; display: inline-block; animation: marquee-scroll 25s linear infinite; }
        @keyframes marquee-scroll { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

        @media (max-width: 1099px) {

                position: fixed; top: 0; right: -100%; width: 280px; height: 100vh;
                background: #0F172A; display: flex; flex-direction: column;

        @media (min-width: 1100px) {

        /* --- [Hero Section] --- */
        .hero { height: 85vh; background: linear-gradient(rgba(15, 23, 42, 0.6), rgba(15, 23, 42, 0.6)), url('https://images.unsplash.com/photo-1541976590-713941fbc7c9?q=80&w=1600') center/cover no-repeat fixed; display: flex; align-items: center; justify-content: center; text-align: center; color: white; }
        .hero h1 { font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 900; margin-bottom: 20px; letter-spacing: 2px; }
        .hero p { font-size: 1.2rem; opacity: 0.9; margin-bottom: 30px; font-weight: 500; }
        .btn-hero { padding: 18px 50px; text-decoration: none; font-size: 1.1rem; font-weight: 800; background: var(--accent); color: white; border-radius: 50px; animation: pulse-gold 2s infinite; display: inline-block; }
        @keyframes pulse-gold { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(184, 134, 11, 0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(184, 134, 11, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(184, 134, 11, 0); } }

        /* --- [數據指標] --- */
        .metrics { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: -60px; padding: 0 5%; position: relative; z-index: 10; }
        .metric-card { background: white; padding: 35px 20px; border-radius: 15px; width: 260px; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.1); border-bottom: 5px solid var(--accent); }
        .metric-card h3 { font-size: 2.8rem; margin: 0; color: var(--primary); font-weight: 900; }
        .metric-card span { font-size: 1.2rem; color: var(--accent); font-weight: 900; margin-left: 2px; }
        .metric-card p { margin: 10px 0 0; font-weight: 700; color: var(--text-muted); font-size: 0.95rem; }

        /* --- [實績對比] --- */
        .section { padding: 80px 6%; max-width: 1400px; margin: 0 auto; }
        .ba-container { position: relative; width: 100%; height: 400px; overflow: hidden; border-radius: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); background: #eee; }
        .ba-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; }
        .after { z-index: 2; width: 50%; border-right: 4px solid var(--white); }
        .ba-slider { position: absolute; -webkit-appearance: none; width: 100%; height: 100%; background: transparent; z-index: 3; cursor: ew-resize; outline: none; margin: 0; }
        
        .ba-label { position: absolute; bottom: 20px; background: rgba(0,0,0,0.6); color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; pointer-events: none; z-index: 4; }
        .label-before { left: 20px; }
        .label-after { right: 20px; }

        .floating-contact { position: fixed; right: 20px; bottom: 30px; display: flex; flex-direction: column; gap: 12px; z-index: 999; }
        .float-btn { width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; font-size: 1.6rem; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: 0.3s; }
        .line-btn { background-color: #06C755; }
        .phone-btn { background-color: var(--accent); }

        footer { background: var(--primary); color: white; padding: 60px 6%; text-align: center; }
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; z-index: 9999; }
    </style>

    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        const menuOverlay = document.getElementById('menuOverlay');

        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            menuOverlay.style.display = navLinks.classList.contains('active') ? 'block' : 'none';
        });

        menuOverlay.addEventListener('click', () => {
            navLinks.classList.remove('active');
            menuOverlay.style.display = 'none';
        });

        window.addEventListener('load', function() {
            setTimeout(() => { 
                document.getElementById('loader').classList.add('loaded'); 
                reveal(); 
            }, 1000); 
        });

        function reveal() {
            document.querySelectorAll(".reveal").forEach(el => {
                if (el.getBoundingClientRect().top < window.innerHeight - 80) {
                    el.classList.add("active");
                }
            });
        }

        const counterObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const counter = entry.target;
                    const target = +counter.getAttribute('data-target');
                    let count = 0;
                    const updateCount = () => {
                        count += target / 50;
                        if (count < target) {
                            counter.innerText = Math.ceil(count);
                            requestAnimationFrame(updateCount);
                        } else { counter.innerText = target; }
                    };
                    updateCount();
                    counterObserver.unobserve(counter);
                }
            });
        }, { threshold: 0.5 });

        document.querySelectorAll('.counter').forEach(c => counterObserver.observe(c));
        window.addEventListener("scroll", reveal);
    </script>
