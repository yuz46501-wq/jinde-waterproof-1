<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <link rel="icon" href="favicon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工程技術規格 | 錦德工程行</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #1E293B; --accent: #B8860B; --bg-light: #F1F5F9;
            --white: #FFFFFF; --text-main: #334155; --border: #CBD5E1;
        }

        * { box-sizing: border-box; }
        body { font-family: "PingFang TC", "Noto Sans TC", sans-serif; margin: 0; background: var(--bg-light); color: var(--text-main); line-height: 1.6; }

        /* --- 導覽列 (依據截圖樣式優化) --- */
        .navbar {
            background: white; height: 80px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 6%; position: sticky; top: 0; z-index: 2000; box-shadow: 0 1px 10px rgba(0,0,0,0.1);
        }
        .logo { font-size: 1.4rem; font-weight: 900; color: var(--primary); text-decoration: none; }
        .logo span { color: var(--accent); }

        .nav-links { display: none; gap: 20px; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--primary); font-weight: 700; font-size: 0.9rem; transition: 0.3s; }
        .nav-links a.active { color: var(--accent); }

        /* 手機版選單按鈕 */
        .menu-btn { display: block; font-size: 1.5rem; cursor: pointer; color: var(--primary); }

        /* 手機版側邊目錄 (對應截圖深色風格) */
        .mobile-nav {
            position: fixed; top: 0; right: -100%; width: 280px; height: 100vh;
            background: #1a1f2b; transition: 0.4s; z-index: 3000; padding: 60px 30px; 
            display: flex; flex-direction: column; gap: 25px;
        }
        .mobile-nav.active { right: 0; }
        .mobile-nav a { color: #fff; text-decoration: none; font-size: 1.1rem; font-weight: 500; border-bottom: 1px solid #2d3548; padding-bottom: 10px; }
        .mobile-nav .close-btn { position: absolute; top: 20px; right: 20px; color: white; font-size: 1.5rem; cursor: pointer; }
        .nav-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2500; display: none; }
        .nav-overlay.active { display: block; }

        @media (min-width: 1024px) {
            .nav-links { display: flex; }
            .menu-btn { display: none; }
        }

        /* --- 內容區 --- */
        .header-box { background: var(--primary); padding: 50px 6%; text-align: center; color: white; }
        .content-wrap { max-width: 1000px; margin: -30px auto 60px; padding: 0 20px; }
        
        .banner-img-box { 
            background: white; padding: 15px; border-radius: 8px; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.15); margin-bottom: 40px;
        }
        .banner-img-box img { width: 100%; display: block; border-radius: 4px; }

        .tech-section { background: white; padding: 40px; border-radius: 8px; margin-bottom: 30px; border-left: 6px solid var(--accent); }
        .tech-section h2 { margin-top: 0; font-size: 1.4rem; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        .layer-list { list-style: none; padding: 0; }
        .layer-list li { padding: 15px 0; border-bottom: 1px dashed var(--border); display: grid; grid-template-columns: 160px 1fr; gap: 15px; }
        .layer-name { font-weight: 900; color: var(--accent); }

        footer { text-align: center; padding: 40px; color: #94a3b8; font-size: 0.85rem; }

        @media (max-width: 768px) {
            .layer-list li { grid-template-columns: 1fr; gap: 5px; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">錦德<span>防水工程</span></a>
        
        <nav class="nav-links">
            <a href="index.html">首頁</a>
            <a href="about.html">關於我們</a>
            <a href="services.html">服務項目</a>
            <a href="methods.html" class="active">專業工法</a>
            <a href="cases.html">實績對比</a>
            <a href="daily.html">工程日常</a>
            <a href="contact.html">預約場勘</a>
        </nav>

        <div class="menu-btn" id="openMenu"><i class="fas fa-bars"></i></div>
    </header>

    <div class="nav-overlay" id="overlay"></div>
    <div class="mobile-nav" id="mobileNav">
        <div class="close-btn" id="closeMenu"><i class="fas fa-times"></i></div>
        <a href="index.html">首頁</a>
        <a href="about.html">關於我們</a>
        <a href="services.html">服務項目</a>
        <a href="methods.html">專業工法</a>
        <a href="cases.html">實績對比</a>
        <a href="daily.html">工程日常</a>
        <a href="contact.html">預約場勘</a>
    </div>

    <div class="header-box">
        <h1>屋頂防水系統結構規格</h1>
    </div>

    <div class="content-wrap">
        <div class="banner-img-box">
            <img src="banner.jpg" alt="屋頂防水五層防禦結構圖">
        </div>

        <div class="tech-section">
            <h2>系統結構層次說明</h2>
            <ul class="layer-list">
                <li><span class="layer-name">第一層：底層結構</span><span>RC 混凝土地面。經研磨處理確保表面無劣化層。</span></li>
                <li><span class="layer-name">第二層：封閉塗層</span><span>高滲透型強效防水底漆。強化基層硬度。</span></li>
                <li><span class="layer-name">第三層：應力補強</span><span>抗裂纖維網。針對熱漲冷縮進行物理性應力分散。</span></li>
                <li><span class="layer-name">第四層：主防水層</span><span>壓克力彈性防水材。具備高延伸率，形成連續無縫膜。</span></li>
                <li><span class="layer-name">第五層：耐候防護</span><span>壓克力防水防熱面漆。阻絕紫外線與熱劣化。</span></li>
            </ul>
        </div>
    </div>

    <footer>© 2026 錦德工程行 | 結構級防水體系</footer>

    <script>
        const openBtn = document.getElementById('openMenu');
        const closeBtn = document.getElementById('closeMenu');
        const mobileNav = document.getElementById('mobileNav');
        const overlay = document.getElementById('overlay');

        function toggleMenu() {
            mobileNav.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        openBtn.addEventListener('click', toggleMenu);
        closeBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);
    </script>
</body>
</html>
