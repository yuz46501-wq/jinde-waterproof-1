<!DOCTYPE html>
<html lang="zh-Hant">
<head>

    <title>錦德防水工程 | 結構防水專家 | 專業抓漏翻修</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #0F172A; --accent: #B8860B; --white: #FFFFFF; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Noto Sans TC", sans-serif; background: #f8fafc; color: #1e293b; line-height: 1.8; overflow-x: hidden; }

        /* --- 導覽列 --- */
        .header-fixed { position: sticky; top: 0; z-index: 1000; background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .navbar { height: 90px; display: flex; align-items: center; justify-content: space-between; padding: 0 5%; }
        .logo { display: flex; align-items: center; font-size: 1.4rem; font-weight: 900; color: var(--primary); text-decoration: none; }
        .logo img { height: 45px; margin-right: 12px; }
        .logo span { color: var(--accent); }
        
        .nav-links { display: none; align-items: center; gap: 20px; }
        .nav-links > a, .dropbtn { text-decoration: none; color: var(--primary); font-weight: 700; cursor: pointer; transition: 0.3s; }
        .nav-links > a:hover, .dropbtn:hover { color: var(--accent); }

        /* 下拉選單 */
        .dropdown { position: relative; }
        .dropdown-content { display: none; position: absolute; background: white; min-width: 180px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); border-radius: 12px; top: 100%; left: 0; padding: 10px 0; z-index: 1000; }
        .dropdown-content a { color: var(--primary); padding: 12px 20px; display: block; text-decoration: none; font-size: 0.95rem; }
        .dropdown-content a:hover { background: #f8fafc; color: var(--accent); }
        .dropdown:hover .dropdown-content { display: block; }

        /* 漢堡選單按鈕 */
        .hamburger { display: block; cursor: pointer; font-size: 1.5rem; }
        @media (min-width: 1024px) { 
            .nav-links { display: flex; } 
            .hamburger { display: none; } 
        }

        /* 動畫與其他區塊 */
        .reveal { opacity: 0; transform: translateY(30px); transition: 1.5s cubic-bezier(0.23, 1, 0.32, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        .hero { padding: 120px 5%; text-align: center; background: white; }
        .services-grid { padding: 60px 5%; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }
        .card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .case-img { transition: transform 0.5s; width: 100%; height: 250px; object-fit: cover; border-radius: 20px; }
        .footer-cta { background: var(--primary); color: white; padding: 60px 5%; text-align: center; border-radius: 40px; margin: 20px 5%; }
    </style>
</head>

            </div>
            <a href='/cases'>實績對比</a>
            <div class="dropdown">

                <div class="dropdown-content">

<section class="footer-cta reveal">

    <p style="margin-top: 15px;">每一項工程皆提供正式契約保障，提供3至5年完善保固，讓您安心交付，無後顧之憂。</p>
</section>
<script>
    function reveal() {
        var reveals = document.querySelectorAll(".reveal");
        for (var i = 0; i < reveals.length; i++) {
            var windowHeight = window.innerHeight;
            var elementTop = reveals[i].getBoundingClientRect().top;
            if (elementTop < windowHeight - 100) { reveals[i].classList.add("active"); }
        }
    }
    window.addEventListener("scroll", reveal);
    window.onload = reveal;
</script>
