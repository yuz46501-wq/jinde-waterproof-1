<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <link rel="icon" href="favicon.png" type="image/png">
    <meta charset="UTF-8">

    <title>預約場勘 | 錦德防水工程 - 中彰投科技抓漏專家</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0F172A; 
            --accent: #C5A059;  
            --accent-light: #E2C792;
            --bg-light: #FDFDFD;
            --white: #FFFFFF;
            --text-main: #334155;
            --text-muted: #94A3B8;
            --line-green: #06C755;
        }

        /* 移除動畫，確保頁面立即加載 */
        * { box-sizing: border-box; scroll-behavior: smooth; }
        body { 
            font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; 
            margin: 0; background: var(--bg-light); color: var(--text-main); 
            line-height: 1.8; overflow-x: hidden;
        }

        /* --- [電腦版導覽列：與首頁同步] --- */
        .navbar {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            height: 90px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 6%; position: sticky; top: 0; z-index: 2000; border-bottom: 1px solid rgba(0,0,0,0.03);
        }
        .logo { display: flex; align-items: center; font-size: 1.4rem; font-weight: 900; color: var(--primary); text-decoration: none; letter-spacing: 2px; }
        .logo img { height: 45px; margin-right: 12px; }
        .logo span { color: var(--accent); }

        .nav-links { display: flex; gap: 30px; align-items: center; }
        .nav-links a { 
            text-decoration: none; color: var(--primary); font-weight: 500; font-size: 0.95rem; 
            transition: 0.3s; letter-spacing: 1px; position: relative;
        }
        .nav-links a::after {
            content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px;
            background: var(--accent); transition: 0.3s;
        }
        .nav-links a:hover { color: var(--accent); }
        .nav-links a:hover::after { width: 100%; }

        .btn-call-nav { 
            background: var(--primary); color: white !important; padding: 12px 28px; border-radius: 2px; 
            font-weight: 600; font-size: 0.9rem; transition: 0.3s;
        }
        .btn-call-nav:hover { background: var(--accent); transform: translateY(-2px); }

        .menu-toggle { display: none; font-size: 1.6rem; color: var(--primary); cursor: pointer; }

        /* --- [手機版側邊欄：與首頁同步] --- */
        .sidebar {
            position: fixed; top: 0; right: -100%; width: 300px; height: 100vh;
            background: var(--primary); z-index: 3000; padding: 60px 40px;
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; gap: 25px;
        }
        .sidebar.active { right: 0; box-shadow: -10px 0 50px rgba(0,0,0,0.3); }
        .sidebar a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 1.1rem; letter-spacing: 2px; transition: 0.3s; }
        .sidebar-close { position: absolute; top: 25px; right: 25px; color: white; font-size: 1.8rem; cursor: pointer; }
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2500; display: none; }
        .sidebar-overlay.active { display: block; }

        /* --- [表單區塊] --- */
        .contact-header { text-align: center; padding: 60px 0 40px; }
        .contact-header h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 900; color: var(--primary); margin: 0; letter-spacing: 2px; }
        .contact-header p { color: var(--accent); letter-spacing: 8px; font-size: 0.8rem; margin-top: 15px; }

        .contact-section { padding: 0 6% 100px; max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.5fr; gap: 60px; }

        .contact-info { background: var(--primary); color: white; padding: 60px 50px; border-radius: 2px; height: fit-content; }
        .contact-info h2 { color: var(--accent); margin-top: 0; font-size: 1.8rem; margin-bottom: 40px; }
        .info-item { display: flex; align-items: flex-start; margin-bottom: 40px; }
        .info-item i { font-size: 1.3rem; color: var(--accent); margin-right: 25px; margin-top: 5px; }
        .info-item p { margin: 0; font-size: 0.9rem; opacity: 0.6; }
        .info-item .val { font-weight: 700; font-size: 1.3rem; opacity: 1; margin-top: 8px; }

        .form-card { background: white; padding: 60px; border-radius: 2px; box-shadow: 0 30px 60px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.02); }
        .form-group { margin-bottom: 30px; }
        .form-group label { display: block; margin-bottom: 12px; font-weight: 700; color: var(--primary); font-size: 0.95rem; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 18px; border: 1px solid #E2E8F0; border-radius: 2px; font-size: 1rem; outline: none; transition: 0.3s; background: #F9FBFF;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); background: white; box-shadow: 0 0 10px rgba(197, 160, 89, 0.1); }
        
        .submit-btn {
            background: var(--accent); color: white; border: none; padding: 22px;
            font-size: 1.1rem; font-weight: 800; cursor: pointer; width: 100%;
            border-radius: 2px; transition: 0.4s; letter-spacing: 4px;
        }
        .submit-btn:hover { background: var(--primary); transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.15); }

        footer { background: var(--primary); color: white; padding: 80px 8% 50px; text-align: center; }
        .line-float { position: fixed; bottom: 40px; right: 40px; background: var(--line-green); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; text-decoration: none; z-index: 3000; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: 0.3s; }

        @media (max-width: 992px) {
            .nav-links { display: none; }
            .menu-toggle { display: block; }
            .navbar { height: 80px; }
            .contact-section { grid-template-columns: 1fr; }
            .form-card { padding: 40px 30px; }
        }
    </style>
</head>
