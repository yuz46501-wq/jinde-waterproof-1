<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工程日常 | 錦德防水工程</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #0F172A; --accent: #B8860B; --bg-light: #F8FAFC; 
            --shadow-sm: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.15);
            --radius: 16px;
        }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 0; background: var(--bg-light); color: var(--primary); line-height: 1.6; }

        /* --- 現代化導覽列 --- */
        .navbar { 
            background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); 
            height: 85px; display: flex; align-items: center; justify-content: space-between; 
            padding: 0 8%; position: sticky; top: 0; z-index: 2000; border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .logo { font-size: 1.3rem; font-weight: 900; text-decoration: none; color: var(--primary); display: flex; align-items: center; }
        .logo img { height: 40px; margin-right: 12px; }
        .logo span { color: var(--accent); margin-left: 4px; }

        .desktop-nav { display: none; gap: 25px; align-items: center; }
        .desktop-nav a, .dropbtn { 
            text-decoration: none; color: var(--primary); font-weight: 600; font-size: 0.9rem; 
            cursor: pointer; border: none; background: none; transition: 0.3s;
        }
        .desktop-nav a:hover, .dropbtn:hover { color: var(--accent); }
        
        .dropdown { position: relative; }
        .dropdown-content { 
            display: none; position: absolute; top: 150%; left: 0; background: white; 
            min-width: 170px; box-shadow: var(--shadow-lg); border-radius: var(--radius); 
            padding: 10px 0; border: 1px solid #f1f5f9;
        }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown-content a { display: block; padding: 12px 20px; font-size: 0.9rem !important; color: #475569 !important; }
        .dropdown-content a:hover { background: #f8fafc; color: var(--accent) !important; }

        /* --- 優雅卡片排版 --- */
        .photo-section { padding: 60px 8% 100px; max-width: 1400px; margin: auto; }
        .daily-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 40px; }
        .daily-card { 
            background: white; border-radius: var(--radius); overflow: hidden; 
            box-shadow: var(--shadow-sm); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .daily-card:hover { transform: translateY(-12px); box-shadow: var(--shadow-lg); }
        .img-wrapper { height: 260px; overflow: hidden; position: relative; }
        .daily-card img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; }
        .daily-card:hover img { transform: scale(1.05); }
        
        .card-tag { 
            position: absolute; top: 20px; left: 20px; background: rgba(184, 134, 11, 0.9); 
            color: white; padding: 5px 16px; border-radius: 50px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px;
        }
        .card-content { padding: 30px; }
        .card-content h3 { font-size: 1.25rem; margin: 0 0 10px 0; }
        .card-content p { color: #64748B; font-size: 0.95rem; }

        @media (min-width: 1024px) { .desktop-nav { display: flex; } }
    </style>
</head>
<body>

<header class="navbar">
    <a href="/" class="logo">
        <img src="https://i.meee.com.tw/xIPEk70.jpg" alt="錦德Logo">
        錦德<span>防水工程</span>
    </a>

    <nav class="desktop-nav">
        <a href="/">首頁</a>
        <a href="/about">關於錦德</a>
        <div class="dropdown">
            <button class="dropbtn">服務項目 <i class="fas fa-caret-down"></i></button>
            <div class="dropdown-content">
                <a href="/水性屋頂防水.html">水性屋頂防水</a>
                <a href="/油性屋頂防水.html">油性屋頂防水</a>
                <a href="/抓漏工程.html">抓漏工程</a>
                <a href="/防水.html">防水工程</a>
                <a href="/油漆工程.html">油漆工程</a>
                <a href="/浴室翻修.html">浴室翻修</a>
            </div>
        </div>
        <a href="/methods.html">專業工法</a>
        <a href="/cases.html">實績對比</a>
        <div class="dropdown">
            <button class="dropbtn" style="color:var(--accent);">工程日常 <i class="fas fa-caret-down"></i></button>
            <div class="dropdown-content">
                <a href="daily.html">錦德團隊紀錄</a>
                <a href="專業知識.html">專業知識</a>
                <a href="人才招募.html">加入我們</a>
            </div>
        </div>
        <a href="/areas">服務區域</a>
        <a href="/contact">預約場勘</a>
    </nav>
</header>

<section class="photo-section">
    <div class="daily-grid">
        <div class="daily-card">
            <div class="img-wrapper"><span class="card-tag">TEAM</span><img src="https://image2url.com/r2/default/images/1770234574028-ca0cc772-3d5f-45fd-a7bc-ea9168c4ba34.jpeg"></div>
            <div class="card-content"><h3>團隊充電時刻</h3><p>高品質工程需要好的夥伴。在忙碌的工期中停下來吃頓好的，這就是錦德最強凝聚力的來源。</p></div>
        </div>
        <div class="daily-card">
            <div class="img-wrapper"><span class="card-tag">WORK</span><img src="https://image2url.com/r2/default/images/1770234458334-423f86df-8ba9-41e2-ad20-cff4a03879ab.jpeg"></div>
            <div class="card-content"><h3>高空作業執行</h3><p>面對最難搞的外牆漏點，我們不嫌麻煩，該掛繩就掛繩，該巡檢就巡檢，這是基本的職人精神。</p></div>
        </div>
        <div class="daily-card">
            <div class="img-wrapper"><span class="card-tag">ANNUAL</span><img src="https://image2url.com/r2/default/images/1770233830579-1b432f49-b16b-4cac-85e3-6a952d37c024.jpeg"></div>
            <div class="card-content"><h3>115 年度尾牙</h3><p>感謝夥伴一整年的拼勁。我們以專業立足，用實力幫客戶解決難題。尾牙充飽電，明年繼續精進！</p></div>
        </div>
    </div>
</section>

</body>
</html>
