<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <link rel="icon" href="favicon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聯絡預約 | 錦德防水工程 - 中彰投免費到府估價</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #0F172A; 
            --accent: #B8860B; 
            --accent-light: #D4AF37;
            --bg-light: #F8FAFC;
            --white: #FFFFFF;
            --line-green: #06C755;
            --text-main: #1E293B;
        }

        * { box-sizing: border-box; scroll-behavior: smooth; }
        body { 
            font-family: "Noto Sans TC", sans-serif; 
            margin: 0; background: var(--bg-light); color: var(--text-main); 
            line-height: 1.8; overflow-x: hidden;
        }

        /* --- 導覽列 --- */
        .navbar {
            background: white; height: 90px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 6%; position: sticky; top: 0; z-index: 2000; box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .logo { display: flex; align-items: center; font-size: 1.6rem; font-weight: 900; color: var(--primary); text-decoration: none; }
        .logo img { height: 50px; margin-right: 12px; }
        .logo span { color: var(--accent); }

        .nav-links { display: none; align-items: center; gap: 25px; }
        .nav-links a { text-decoration: none; color: var(--primary); font-weight: 700; transition: 0.3s; }
        .nav-links a:hover { color: var(--accent); }
        .btn-call-nav { background: var(--accent); color: white !important; padding: 12px 25px; border-radius: 50px; }

        .hamburger { cursor: pointer; font-size: 1.5rem; color: var(--primary); z-index: 10001; }

        /* --- 側邊欄 --- */
        .sidebar {
            position: fixed; top: 0; right: -100%; width: 280px; height: 100vh;
            background: var(--primary); z-index: 10000; padding: 100px 35px;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column;
        }
        .sidebar.active { right: 0; }
        .sidebar a { color: white; text-decoration: none; padding: 15px 0; font-size: 1.1rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sidebar-close { position: absolute; top: 30px; right: 30px; color: white; font-size: 1.8rem; cursor: pointer; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; display: none; }
        .overlay.active { display: block; }

        @media (min-width: 1100px) {
            .nav-links { display: flex; }
            .hamburger { display: none; }
        }

        /* --- 標題區 --- */
        .page-header {
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), 
                        url('https://images.unsplash.com/photo-1423666639041-f56000c27a9a?q=80&w=1600') center/cover;
            padding: 80px 5%; text-align: center; color: white;
        }
        .page-header h1 { font-size: clamp(2.5rem, 6vw, 3.5rem); font-weight: 900; margin: 0; letter-spacing: 2px; }

        /* --- 內容佈局 --- */
        .section { padding: 80px 6%; max-width: 1300px; margin: 0 auto; }
        .contact-wrapper { display: grid; grid-template-columns: 1fr; gap: 60px; }
        @media (min-width: 1024px) { .contact-wrapper { grid-template-columns: 1fr 1.5fr; } }

        .contact-info h2 { color: var(--primary); font-size: 2.2rem; font-weight: 900; margin-bottom: 40px; }
        .info-item { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .info-item i { background: var(--accent); color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .info-item h4 { margin: 0; color: var(--primary); font-size: 1.2rem; font-weight: 800; }
        .info-item p { margin: 5px 0 0; color: #64748b; }

        .line-btn-big { 
            background: var(--line-green); color: white; padding: 20px; border-radius: 15px; 
            text-decoration: none; display: flex; align-items: center; justify-content: center; 
            gap: 15px; font-weight: 900; font-size: 1.4rem; margin-top: 30px; transition: 0.3s; 
        }
        .line-btn-big:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(6, 199, 85, 0.3); }

        /* 表單 */
        .contact-form { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 800; color: var(--primary); }
        .form-group input, .form-group textarea, .form-group select { 
            width: 100%; padding: 15px; border: 2px solid #f1f5f9; border-radius: 12px; font-size: 1rem; transition: 0.3s; background: #f8fafc;
        }
        .form-group input:focus { border-color: var(--accent); outline: none; background: white; }
        .submit-btn { 
            background: var(--primary); color: white; width: 100%; padding: 18px; border: none; 
            border-radius: 12px; font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: 0.3s;
        }
        .submit-btn:hover { background: var(--accent); transform: translateY(-3px); }

        /* 成功視窗 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 10000; }
        .modal-card { background: white; padding: 40px; border-radius: 25px; text-align: center; max-width: 400px; width: 90%; }
        .modal-card i { font-size: 60px; color: var(--line-green); margin-bottom: 20px; }

        footer { background: var(--primary); color: white; padding: 60px 6%; text-align: center; }
        .reveal { opacity: 0; transform: translateY(30px); transition: 0.8s ease; }
        .reveal.active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo"><img src="favicon.png">錦德<span>防水工程</span></a>
        <nav class="nav-links">
            <a href="index.html">首頁</a>
            <a href="about.html">關於錦德</a>
            <a href="services.html">服務項目</a>
            <a href="cases.html">實績對比</a>
            <a href="daily.html">工程日常</a>
            <a href="areas.html">服務區域</a>
            <a href="contact.html" class="btn-call-nav">立即預約</a>
        </nav>
        <div class="hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
    </header>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-close" onclick="toggleSidebar()"><i class="fas fa-times"></i></div>
        <a href="index.html">首頁</a>
        <a href="about.html">關於錦德</a>
        <a href="services.html">服務項目</a>
        <a href="cases.html">實績對比</a>
        <a href="daily.html">工程日常</a>
        <a href="areas.html">服務區域</a>
        <a href="contact.html" style="color:var(--accent-light); font-weight:bold;">立即預約</a>
    </div>

    <section class="page-header">
        <h1 class="reveal">聯絡錦德防水</h1>
        <p class="reveal">專業師傅免費到府場勘，解決您的漏水煩惱</p>
    </section>

    <section class="section">
        <div class="contact-wrapper">
            <div class="contact-info reveal">
                <h2>立即聯繫</h2>
                <div class="info-item">
                    <i class="fas fa-phone-alt"></i>
                    <div>
                        <h4>預約專線</h4>
                        <p><a href="tel:0963696032" style="text-decoration:none; color:inherit; font-weight:900; font-size: 1.3rem;">0963-696-032</a></p>
                    </div>
                </div>
                <div class="info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <div>
                        <h4>公司地址</h4>
                        <p>台中市太平區東村八街37巷8號</p>
                    </div>
                </div>
                <a href="https://line.me/ti/p/rqqh-uyZsq" class="line-btn-big" target="_blank"><i class="fab fa-line"></i> LINE 線上諮詢</a>
            </div>

            <div class="contact-form reveal">
                <form id="contactForm">
                    <input type="hidden" name="access_key" value="d9e5c0ca-40bd-45d0-a8c5-e802bfc12957">
                    <div class="form-group">
                        <label>您的姓名</label>
                        <input type="text" name="name" placeholder="如何稱呼您？" required>
                    </div>
                    <div class="form-group">
                        <label>聯絡電話</label>
                        <input type="tel" name="phone" placeholder="例如：0912345678" required>
                    </div>
                    <div class="form-group">
                        <label>施工項目</label>
                        <select name="service_type">
                            <option value="屋頂防水">屋頂防水</option>
                            <option value="科技抓漏">科技抓漏</option>
                            <option value="外牆止漏">外牆止漏</option>
                            <option value="浴室翻修">浴室翻修</option>
                            <option value="其他">其他漏水問題</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>狀況描述</label>
                        <textarea name="message" rows="4" placeholder="請簡單描述漏水位置或狀況..."></textarea>
                    </div>
                    <button type="submit" class="submit-btn" id="submitBtn">送出預約表單</button>
                </form>
            </div>
        </div>
    </section>

    <div class="modal-overlay" id="successModal">
        <div class="modal-card">
            <i class="fas fa-check-circle"></i>
            <h3>預約已送出！</h3>
            <p>我們會盡快與您聯繫。</p>
            <button class="submit-btn" onclick="closeModal()">我知道了</button>
        </div>
    </div>

    <footer>
        <h2 style="font-size: 1.5rem; color: var(--accent); font-weight: 900;">錦德防水工程</h2>
        <p>台中市太平區東村八街37巷8號 | 0963-696-032</p>
        <p style="opacity: 0.5; font-size: 0.8rem; margin-top: 20px;">© 2026 JINDE | 誠信 ‧ 專業 ‧ 在地保固</p>
    </footer>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function reveal() {
            document.querySelectorAll(".reveal").forEach(el => {
                if (el.getBoundingClientRect().top < window.innerHeight - 80) el.classList.add("active");
            });
        }
        window.addEventListener("scroll", reveal);
        window.onload = reveal;

        const form = document.getElementById('contactForm');
        const modal = document.getElementById('successModal');

        function closeModal() { modal.style.display = 'none'; form.reset(); }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 傳送中...';
            btn.style.pointerEvents = 'none';

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(Object.fromEntries(new FormData(form)))
            })
            .then(res => { if(res.status == 200) modal.style.display = 'flex'; else alert("錯誤，請直撥專線。"); })
            .finally(() => { btn.innerHTML = '送出預約表單'; btn.style.pointerEvents = 'auto'; });
        });
    </script>
</body>
</html>
