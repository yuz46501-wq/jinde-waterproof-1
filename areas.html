<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <link rel="icon" href="favicon.png" type="image/png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0F172A; 
            --accent: #C5A059;  
            --accent-light: #E2C792;
            --bg-light: #FDFDFD;
            --white: #FFFFFF;
            --text-main: #334155;
            --text-muted: #94A3B8;
            --line-green: #06C755;
        }

        * { box-sizing: border-box; scroll-behavior: smooth; }
        body { 
            font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; 
            margin: 0; background: var(--bg-light); color: var(--text-main); 
            line-height: 1.8; overflow-x: hidden;
        }

        /* --- [動畫定義] --- */
        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(197, 160, 89, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(197, 160, 89, 0); }
            100% { box-shadow: 0 0 0 0 rgba(197, 160, 89, 0); }
        }
        @keyframes shake {
            0% { transform: rotate(0); }
            25% { transform: rotate(5deg); }
            50% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
            100% { transform: rotate(0); }
        }

        /* --- [導覽列] --- */
        .navbar {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            height: 90px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 6%; position: sticky; top: 0; z-index: 2000; border-bottom: 1px solid rgba(0,0,0,0.03);
        }
        .logo { display: flex; align-items: center; font-size: 1.4rem; font-weight: 900; color: var(--primary); text-decoration: none; letter-spacing: 2px; }
        .logo img { height: 45px; margin-right: 12px; }
        .logo span { color: var(--accent); }

        .nav-links { display: flex; gap: 30px; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--primary); font-weight: 600; font-size: 0.95rem; transition: 0.3s; position: relative; }
        .nav-links a::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px; background: var(--accent); transition: 0.3s; }
        .nav-links a:hover::after { width: 100%; }

        .btn-call-nav { 
            background: var(--accent); color: white !important; padding: 12px 28px; border-radius: 50px; 
            font-weight: 700; font-size: 0.9rem; transition: 0.3s;
        }
        .btn-call-nav:hover { animation: shake 0.4s ease-in-out; background: var(--primary); }

        /* --- [手機側邊欄] --- */
        .menu-toggle { display: none; font-size: 1.6rem; color: var(--primary); cursor: pointer; }
        .sidebar { position: fixed; top: 0; right: -100%; width: 300px; height: 100vh; background: var(--primary); z-index: 3000; padding: 60px 40px; transition: 0.5s; display: flex; flex-direction: column; gap: 25px; }
        .sidebar.active { right: 0; }
        .sidebar a { color: white; text-decoration: none; font-size: 1.1rem; }
        .sidebar-close { position: absolute; top: 25px; right: 25px; color: white; font-size: 1.8rem; cursor: pointer; }
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2500; display: none; }
        .sidebar-overlay.active { display: block; }

        /* --- [頁面內容] --- */
        .page-header {
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
                        url('https://images.unsplash.com/photo-1449156001437-3a1661acda22?q=80&w=1600') center/cover;
            padding: 100px 6% 120px; text-align: center; color: white;
        }
        .page-header h1 { font-size: 2.8rem; font-weight: 900; letter-spacing: 4px; margin: 0; }
        .page-header p { font-size: 1.1rem; letter-spacing: 6px; opacity: 0.8; margin-top: 20px; }

        .section { padding: 0 6% 100px; max-width: 1400px; margin: 0 auto; }

        .area-container {
            display: grid; grid-template-columns: 1fr 1.5fr; gap: 50px;
            background: white; padding: 60px; border-radius: 2px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.05); margin-top: -80px;
        }
        
        .area-info h2 { color: var(--primary); font-size: 2.2rem; font-weight: 900; margin-bottom: 40px; border-left: 6px solid var(--accent); padding-left: 20px; }
        .city-name { font-size: 1.3rem; font-weight: 800; color: var(--accent); margin-bottom: 20px; display: block; }
        
        .dist-tag { 
            display: inline-block; background: #F8FAFC; padding: 10px 20px; 
            border-radius: 2px; margin: 5px; font-size: 1rem; font-weight: 600;
            border: 1px solid #E2E8F0; transition: 0.3s; color: var(--primary);
        }
        .dist-tag:hover { background: var(--primary); color: white; transform: translateY(-3px); }

        .btn-call {
            display: block; background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white; padding: 22px; border-radius: 50px; text-decoration: none; 
            font-weight: 900; font-size: 1.2rem; text-align: center; 
            transition: 0.3s; letter-spacing: 4px; margin-top: 40px;
            animation: pulse-gold 2s infinite;
        }

        .map-wrapper { border-radius: 2px; overflow: hidden; min-height: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        iframe { width: 100%; height: 100%; border: 0; }

        /* 數據跑分 */
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 80px; }
        .stat-item { padding: 50px 30px; background: white; border-radius: 2px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        .stat-item i { font-size: 2.5rem; color: var(--accent); margin-bottom: 20px; }
        .stat-item h3 { font-size: 3.2rem; color: var(--primary); font-weight: 900; }

        footer { background: var(--primary); color: white; padding: 80px 8% 50px; text-align: center; }

        /* --- [LINE 懸浮按鈕樣式] --- */
        .line-float { 
            position: fixed; bottom: 40px; right: 40px; 
            background: var(--line-green); color: white; 
            width: 65px; height: 65px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 35px; text-decoration: none; z-index: 3000; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: 0.3s; 
        }
        .line-float:hover { transform: scale(1.1); box-shadow: 0 15px 40px rgba(0,0,0,0.3); }

        @media (max-width: 992px) {
            .nav-links { display: none; }
            .menu-toggle { display: block; }
            .area-container { grid-template-columns: 1fr; padding: 40px 25px; }
            .stat-grid { grid-template-columns: 1fr; }
            .line-float { bottom: 30px; right: 30px; width: 55px; height: 55px; font-size: 28px; }
        }
    </style>
</head>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.querySelector('.sidebar-overlay').classList.toggle('active');
        }
        function countUp() {
            const counters = document.querySelectorAll('.counter');
            counters.forEach(counter => {
                const observer = new IntersectionObserver((entries) => {
                    if (entries[0].isIntersecting) {
                        const target = +counter.getAttribute('data-target');
                        let count = 0;
                        const update = () => {
                            count += (target / 80);
                            if (count < target) {
                                counter.innerText = Math.ceil(count);
                                requestAnimationFrame(update);
                            } else { counter.innerText = target; }
                        };
                        update();
                        observer.unobserve(counter);
                    }
                }, { threshold: 0.5 });
                observer.observe(counter);
            });
        }
        window.addEventListener("load", countUp);
    </script>
